name: Deploy LedgerExplorer to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/ledgerexplorer-pages"
          mkdir -p "${site}/data"
          cp -a web/. "${site}/"
          cp -a data/sample "${site}/data/sample"

          test -f "${site}/index.html"
          test -f "${site}/app.js"
          test -f "${site}/app.css"
          test -d "${site}/i18n"
          test -f "${site}/data/sample/index.json"
          test -f "${site}/data/sample/ja/tidy/2021-04.csv"
          test -f "${site}/data/sample/en/tidy/2021-04.csv"

          if find "${site}" -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in the Pages artifact." >&2
            exit 1
          fi
          if find "${site}" -type f -links +1 -print -quit | grep -q .; then
            echo "Hard links are not allowed in the Pages artifact." >&2
            exit 1
          fi
          for forbidden in full out private secrets .env .git .github docs; do
            if find "${site}" -name "${forbidden}" -print -quit | grep -q .; then
              echo "Forbidden artifact entry found: ${forbidden}" >&2
              exit 1
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ledgerexplorer-pages

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
